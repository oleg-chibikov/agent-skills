name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the installer
        run: shellcheck install.sh

      # A description holding ": " breaks the YAML and the skill goes missing
      # from every agent, with no error anywhere.
      - name: Every skill has frontmatter an agent can read
        run: |
          fail=0
          for file in skills/*/SKILL.md; do
            head -1 "$file" | grep -qx -- '---' \
              || { echo "$file: first line is not ---"; fail=1; continue; }
            body=$(sed -n '2,/^---$/p' "$file")
            printf '%s\n' "$body" | grep -q '^name: ' \
              || { echo "$file: no name"; fail=1; }
            desc=$(printf '%s\n' "$body" | grep -m1 '^description: ' \
              | sed 's/^description: //')
            [ -n "$desc" ] || { echo "$file: no description"; fail=1; continue; }
            case "$desc" in
              "'"*|'"'*) ;;
              *': '*) echo "$file: description has \": \", quote it"; fail=1 ;;
            esac
          done
          exit "$fail"

      # Every link a skill points at has to exist, or the agent reads nothing.
      - name: Reference files a skill points at exist
        run: |
          fail=0
          for file in skills/*/SKILL.md; do
            for ref in $(grep -o '(references/[^)]*)' "$file" | tr -d '()'); do
              [ -f "$(dirname "$file")/$ref" ] \
                || { echo "$file: missing $ref"; fail=1; }
            done
          done
          exit "$fail"

      # A skill that breaks the rule it teaches gives the agent a counterexample.
      # The writing-style skill is exempt: it has to name the words it bans.
      - name: Skills follow their own writing rules
        run: |
          hits=$(grep -rnwiE 'never' skills --include='*.md' \
            | grep -v '^skills/writing-style/' \
            | grep -v '"never"' \
            | grep -v ':[0-9]*:|' || true)
          [ -z "$hits" ] || { echo "$hits"; echo 'use "do not" instead'; exit 1; }

      - name: Install and uninstall in a clean home
        run: |
          home=$(mktemp -d)
          mkdir -p "$home/.claude" "$home/.codex"
          printf '# a note of my own\n' > "$home/.claude/CLAUDE.md"
          HOME="$home" ./install.sh --lang Spanish
          for dir in "$home/.agents/skills" "$home/.claude/skills" "$home/.codex/skills"; do
            for name in review create-pr writing-style; do
              test -f "$dir/$name/SKILL.md"
            done
          done
          test -f "$home/.agents/skills/review/references/pr-links.md"
          grep -qx Spanish "$home/.agents/skills/review/LANGUAGE.md"
          # One folder holds the files, the rest are links to it.
          test 0 -eq "$(find "$home" -name SKILL.md -type f | wc -l)"
          # The writing rules reach the files an agent reads on every turn.
          test -L "$home/.agents/writing-style.instructions.md"
          test -f "$home/.codex/AGENTS.md"
          HOME="$home" ./install.sh --lang Spanish
          test 1 -eq "$(grep -c 'agent-skills: writing rules' "$home/.claude/CLAUDE.md")"
          HOME="$home" ./install.sh --uninstall --yes
          test ! -e "$home/.claude/skills/review"
          test ! -e "$home/.agents/writing-style.instructions.md"
          test ! -e "$home/.codex/AGENTS.md"
          grep -qx '# a note of my own' "$home/.claude/CLAUDE.md"
          ! grep -q agent-skills "$home/.claude/CLAUDE.md"

      # The uninstall used to empty the folder every agent links to, which left
      # the next install with nothing to link.
      - name: Uninstall leaves the source folder alone
        run: |
          home=$(mktemp -d)
          mkdir -p "$home/.claude"
          cp -R . "$home/.agent-skills"
          cat install.sh | HOME="$home" AGENT_SKILLS_DIR="$home/.agent-skills" \
            sh -s -- --lang Spanish
          test -f "$home/.claude/skills/review/SKILL.md"
          cat install.sh | HOME="$home" AGENT_SKILLS_DIR="$home/.agent-skills" \
            sh -s -- --uninstall --yes
          test -f "$home/.agent-skills/skills/review/SKILL.md"
          cat install.sh | HOME="$home" AGENT_SKILLS_DIR="$home/.agent-skills" \
            sh -s -- --lang Spanish
          test -f "$home/.claude/skills/review/SKILL.md"
