name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the installer
        run: shellcheck install.sh

      # A description holding ": " breaks the YAML and the skill goes missing
      # from every agent, with no error anywhere.
      - name: Every skill has frontmatter an agent can read
        run: |
          fail=0
          for file in skills/*/SKILL.md; do
            head -1 "$file" | grep -qx -- '---' \
              || { echo "$file: first line is not ---"; fail=1; continue; }
            body=$(sed -n '2,/^---$/p' "$file")
            printf '%s\n' "$body" | grep -q '^name: ' \
              || { echo "$file: no name"; fail=1; }
            desc=$(printf '%s\n' "$body" | grep -m1 '^description: ' \
              | sed 's/^description: //')
            [ -n "$desc" ] || { echo "$file: no description"; fail=1; continue; }
            case "$desc" in
              "'"*|'"'*) ;;
              *': '*) echo "$file: description has \": \", quote it"; fail=1 ;;
            esac
          done
          exit "$fail"
